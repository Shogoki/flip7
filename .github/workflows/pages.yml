name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reads the repo's Pages config. It deliberately does not pass
      # `enablement`: creating a Pages site needs admin rights the workflow's
      # GITHUB_TOKEN does not carry, so it can only fail confusingly. Pages is
      # switched on by hand once — see the README.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        # Publish only the app itself — the Dockerfile and nginx config are
        # deployment plumbing and don't belong on the public site.
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
